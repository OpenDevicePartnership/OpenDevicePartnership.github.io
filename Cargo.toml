[package]
name = "odp"
version = "0.1.0"
edition = "2021"

[dependencies]
console_error_panic_hook = "0.1.7"
leptos = { version = "0.8.2", features = ["csr"] }
leptos_meta = "0.8.2"
leptos_router = "0.8.2"
unocss-classes = "2"
wasm-bindgen = "0.2.100"
# All the web-sys features we use directly (Window, Document, Console)
# are already enabled transitively by leptos's `csr` feature, so we
# don't need to opt into them again here. We still depend on web-sys
# directly for the `web_sys::js_sys` re-export and `web_sys::window()`
# in `repo_view.rs`.
web-sys = "0.3.77"

[dev-dependencies]
js-sys = "0.3"
serde_json = "1"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"

[package.metadata.leptos]
assets-dir="public"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
